<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザーのタブに表示するページ名 -->
    <title>会員登録 | ShopFlow</title>
</head>

<body>
    <main>
        <h1>ShopFlow 会員登録</h1>

        <!-- 登録に失敗した場合の案内メッセージ -->
        <p th:if="${param.error}" role="alert">
            登録できませんでした。入力内容を確認してください。
            ユーザー名やメールアドレスが登録済みの場合は、別の値を使用してください。
        </p>


        <!-- 会員登録フォーム。
             登録処理のURLは、次の作業でコントローラーに実装する。 -->
        <form th:action="@{/register}" method="post">

            <!-- ユーザー名の入力欄 -->
            <div>
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" maxlength="50" autocomplete="username" required>
            </div>

            <!-- メールアドレスの入力欄 -->
            <div>
                <label for="email">メールアドレス</label>
                <input type="email" id="email" name="email" maxlength="255" autocomplete="email" required>
            </div>

            <!-- パスワードの入力欄 -->
            <div>
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" autocomplete="new-password" required>
            </div>

            <!-- 入力内容を送信するボタン -->
            <button type="submit">会員登録</button>
        </form>

        <!-- 既にアカウントを持っている場合のログインリンク -->
        <p>
            すでにアカウントをお持ちの方は
            <a th:href="@{/login}">ログイン</a>
        </p>
    </main>
</body>

</html>
