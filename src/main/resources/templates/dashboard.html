<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザーのタブに表示するページ名 -->
    <title>ダッシュボード | ShopFlow</title>
</head>

<body>
    <main>
        <!-- ログイン後に表示するダッシュボードの見出し -->
        <h1>ShopFlow ダッシュボード</h1>

        <!-- ログイン成功時のメッセージ -->
        <p>ログインに成功しました。</p>

        <!--
            商品一覧画面へのリンク。
            クリックするとProductViewControllerの
            /productsに対応する処理が実行される。
        -->
        <section>
            <h2>商品</h2>
            <p>登録されている商品を確認できます。</p>
            <a th:href="@{/products}">商品一覧へ</a>
        </section>

        <!--
            ログアウト用フォーム。
            Spring Securityのログアウト処理にPOSTで送信する。
            ThymeleafとSpring Securityの連携により、
            通常はCSRFトークンがフォームに追加される。
        -->
        <form th:action="@{/logout}" method="post">
            <button type="submit">ログアウト</button>
        </form>
    </main>
</body>

</html>
