<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopFlow 商品管理</title>
</head>

<body>
    <h1>ShopFlow 商品管理</h1>

    <!-- 商品登録画面へ移動する。 -->
    <p>
        <a th:href="@{/admin/products/new}">新しい商品を登録する</a>
    </p>

    <!-- 在庫数を条件に商品を検索する。 -->
    <h2>在庫検索</h2>
    <form th:action="@{/admin/products/stock}" method="get">
        <label for="stockQuantity">在庫数の上限：</label>
        <input type="number" id="stockQuantity" name="stockQuantity" min="0"
            th:value="${stockQuantity != null ? stockQuantity : 5}" required>
        <button type="submit">検索</button>
        <a th:href="@{/admin/products}">検索を解除</a>
    </form>

    <!-- 商品の登録・更新・削除結果を表示する。 -->
    <p th:if="${successMessage != null}" th:text="${successMessage}"></p>
    <p th:if="${errorMessage != null}" th:text="${errorMessage}"></p>

    <h2>商品一覧</h2>

    <!-- 商品が0件の場合に表示する。 -->
    <p th:if="${#lists.isEmpty(products)}">
        登録されている商品はありません。
    </p>

    <!-- 商品が存在する場合は一覧表を表示する。 -->
    <table th:if="${!#lists.isEmpty(products)}" border="1" cellpadding="8">
        <thead>
            <tr>
                <th>ID</th>
                <th>商品名</th>
                <th>商品説明</th>
                <th>価格（円）</th>
                <th>在庫数</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}"></td>
                <td th:text="${product.name}"></td>
                <td th:text="${product.description != null ? product.description : '未設定'}"></td>
                <td th:text="${product.price}"></td>
                <td th:text="${product.stockQuantity}"></td>
                <td>
                    <!-- 商品編集画面へのリンク。 -->
                    <a th:href="@{/admin/products/{id}/edit(id=${product.id})}">
                        編集
                    </a>

                    <!-- 商品削除はPOSTリクエストで実行する。 -->
                    <form th:action="@{/admin/products/{id}/delete(id=${product.id})}" method="post">
                        <button type="submit" onclick="return confirm('この商品を削除しますか？');">
                            削除
                        </button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <!-- 管理者ダッシュボードへ戻る。 -->
    <p>
        <a th:href="@{/admin/dashboard}">
            管理者ダッシュボードへ戻る
        </a>
    </p>

    <!-- Spring Securityのログアウト処理を実行する。 -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">ログアウト</button>
    </form>
</body>

</html>
