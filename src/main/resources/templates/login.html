<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザーのタブに表示するページ名 -->
    <title>ログイン | ShopFlow</title>
</head>

<body>
    <main>
        <h1>ShopFlow ログイン</h1>


        <!-- 会員登録が完了した場合の案内メッセージ -->
        <p th:if="${param.registered}" role="status">
            会員登録が完了しました。登録したユーザー名とパスワードでログインしてください。
        </p>


        <!-- ログイン失敗時にエラーメッセージを表示する -->
        <p th:if="${param.error}" role="alert">
            ユーザー名またはパスワードが正しくありません。
        </p>

        <!-- ログアウト完了時にメッセージを表示する -->
        <p th:if="${param.logout}">
            ログアウトしました。
        </p>

        <!-- Spring Securityのログイン処理に入力内容を送信する -->
        <form th:action="@{/login}" method="post">

            <!-- Spring Securityの標準設定に合わせたユーザー名の入力欄 -->
            <div>
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" autocomplete="username" required>
            </div>

            <!-- Spring Securityの標準設定に合わせたパスワードの入力欄 -->
            <div>
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>

            <!-- ログイン認証を開始するボタン -->
            <button type="submit">ログイン</button>
        </form>

        <!-- 会員登録がまだの場合のリンク -->
        <p>
            アカウントをお持ちでない方は
            <a th:href="@{/register}">会員登録</a>
        </p>
    </main>
</body>

</html>
