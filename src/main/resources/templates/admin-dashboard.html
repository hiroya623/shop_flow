<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <!-- スマートフォンなどの画面幅に合わせて表示する。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ブラウザのタブに表示するページタイトル。 -->
    <title>ShopFlow 管理者ダッシュボード</title>
</head>

<body>
    <!-- 管理者向け画面の見出し。 -->
    <h1>ShopFlow 管理者ダッシュボード</h1>

    <!-- 管理者向け画面が表示されたことを確認するメッセージ。 -->
    <p>管理者としてログインしています。</p>

    <!-- 一般会員向けダッシュボードへのリンク。 -->
    <p>
        <a th:href="@{/dashboard}">一般会員向けダッシュボードへ戻る</a>
    </p>

    <!-- Spring Securityのログアウト処理へPOSTリクエストを送信する。 -->
    <form th:action="@{/logout}" method="post">
        <button type="submit">ログアウト</button>
    </form>
</body>

</html>
